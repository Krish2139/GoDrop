services:
  # ====================================================================
  # POSTGRESQL 16 DATABASE (Authoritative Relational Store)
  # ====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: rideflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rideflow_user} -d ${POSTGRES_DB:-rideflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rideflow-network

  # ====================================================================
  # REDIS 7 (Cache & Token Bucket Rate Limiting)
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: rideflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rideflow-network

  # ====================================================================
  # RABBITMQ 3.13 (Message Broker with Management UI)
  # ====================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rideflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rideflow-network

volumes:
  pgdata:
  redisdata:

networks:
  rideflow-network:
    driver: bridge

