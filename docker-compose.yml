services:
  # ====================================================================
  # 1. POSTGRESQL 16 (Authoritative ACID Relational Store)
  # ====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: rideflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rideflow_user} -d ${POSTGRES_DB:-rideflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rideflow-network

  # ====================================================================
  # 2. REDIS 7 (Distributed Cache, Rate Limiter & Pub/Sub Event Bridge)
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: rideflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rideflow-network

  # ====================================================================
  # 3. RABBITMQ 3.13 (AMQP Topic & Dead-Letter Exchange Broker)
  # ====================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rideflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rideflow-network

  # ====================================================================
  # 4. API GATEWAY (Reverse Proxy, JWT Auth, Circuit Breaker, Socket.IO)
  # ====================================================================
  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: rideflow-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rideflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secure_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RIDE_SERVICE_URL: http://ride-service:5001
      DRIVER_SERVICE_URL: http://driver-service:5002
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_rideflow_academic_system_design_2026}
    ports:
      - "5000:5000"
    volumes:
      - ./gateway/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rideflow-network

  # ====================================================================
  # 5. RIDE DOMAIN SERVICE (State Machine, Outbox Relay & Dispatch)
  # ====================================================================
  ride-service:
    build:
      context: ./services/ride-service
      dockerfile: Dockerfile
    container_name: rideflow-ride-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rideflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secure_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DRIVER_SERVICE_URL: http://driver-service:5002
    ports:
      - "5001:5001"
    volumes:
      - ./services/ride-service/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rideflow-network

  # ====================================================================
  # 6. DRIVER FLEET SERVICE (Driver Profiles, Geospatial Proximity & Caching)
  # ====================================================================
  driver-service:
    build:
      context: ./services/driver-service
      dockerfile: Dockerfile
    container_name: rideflow-driver-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rideflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secure_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5002:5002"
    volumes:
      - ./services/driver-service/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rideflow-network

  # ====================================================================
  # 7. ASYNC DISPATCH WORKER (RabbitMQ Consumer & Proximity Dispatcher)
  # ====================================================================
  dispatch-worker:
    build:
      context: ./workers/dispatch-worker
      dockerfile: Dockerfile
    container_name: rideflow-dispatch-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rideflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secure_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RIDE_SERVICE_URL: http://ride-service:5001
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rideflow-network

  # ====================================================================
  # 8. NOTIFICATION WORKER (Multi-Channel Alerts & PostgreSQL Archive)
  # ====================================================================
  notification-worker:
    build:
      context: ./workers/notification-worker
      dockerfile: Dockerfile
    container_name: rideflow-notification-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rideflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideflow_secure_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rideflow-network

  # ====================================================================
  # 9. FRONTEND (Vite React + Nginx Reverse Proxy)
  # ====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rideflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "3001:80"
      - "3002:80"
      - "3003:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api-gateway
    networks:
      - rideflow-network

volumes:
  pgdata:
    name: rideflow-pgdata
  redisdata:
    name: rideflow-redisdata

networks:
  rideflow-network:
    name: rideflow-network
    driver: bridge
